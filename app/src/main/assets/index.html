<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Tech News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --faint:#86868b;
  --border:rgba(0,0,0,.06); --accent:#0071e3; --accent-soft:rgba(0,113,227,.08);
  --chip-bg:#fff; --chip-active-bg:#1d1d1f; --chip-active-text:#fff;
  --shadow:0 1px 3px rgba(0,0,0,.06); --topbar:rgba(245,245,247,.88);
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --faint:#8e8e93;
  --border:rgba(255,255,255,.08); --accent:#0a84ff; --accent-soft:rgba(10,132,255,.15);
  --chip-bg:#1c1c1e; --chip-active-bg:#f5f5f7; --chip-active-text:#1d1d1f;
  --shadow:0 1px 3px rgba(0,0,0,.5); --topbar:rgba(0,0,0,.85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --faint:#8e8e93;
    --border:rgba(255,255,255,.08); --accent:#0a84ff; --accent-soft:rgba(10,132,255,.15);
    --chip-bg:#1c1c1e; --chip-active-bg:#f5f5f7; --chip-active-text:#1d1d1f;
    --shadow:0 1px 3px rgba(0,0,0,.5); --topbar:rgba(0,0,0,.85);
  }
}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

.top-bar{position:sticky;top:0;z-index:10;background:var(--topbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);padding-top:calc(16px + env(safe-area-inset-top))}
.header-content{display:flex;justify-content:space-between;align-items:center;padding:0 20px 14px;max-width:640px;margin:0 auto}
.header-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.title{font-size:22px;font-weight:700;letter-spacing:-.5px}
.subtitle{font-size:12px;color:var(--faint);font-weight:500}
.subtitle .live-dot{display:inline-block;width:6px;height:6px;background:#34c759;border-radius:50%;margin-right:6px;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.hdr-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--card);color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all .2s ease}
.hdr-btn:active{transform:scale(.92);color:var(--accent)}
.hdr-btn.active{background:var(--chip-active-bg);color:var(--chip-active-text)}
.hdr-btn.spinning svg{animation:spin 1s linear infinite}
.hdr-btn svg{width:16px;height:16px}
@keyframes spin{to{transform:rotate(360deg)}}

.source-filters{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;max-width:640px;margin:0 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.source-filters::-webkit-scrollbar{display:none}
.filter-pill{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:100px;border:1px solid var(--border);background:var(--chip-bg);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s ease;white-space:nowrap;font-family:inherit}
.filter-pill:active{transform:scale(.95)}
.filter-pill.active{background:var(--chip-active-bg);color:var(--chip-active-text);border-color:var(--chip-active-bg);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.filter-pill .pill-icon{width:14px;height:14px;border-radius:3px;flex-shrink:0;background:var(--border)}
.filter-pill .count{font-size:11px;font-weight:600;color:var(--faint);padding:1px 6px;background:var(--border);border-radius:100px}
.filter-pill.active .count{background:rgba(128,128,128,.25);color:var(--chip-active-text)}

.date-picker,.search-bar{padding:12px 20px;max-width:640px;margin:0 auto;display:none;gap:8px;align-items:center}
.date-picker input[type="date"],.search-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--chip-bg);color:var(--text);font-size:15px;font-family:inherit;font-weight:500}
.date-picker input[type="date"]:focus,.search-bar input:focus{outline:none;border-color:var(--accent)}
.date-picker button{padding:10px 16px;border:1px solid var(--border);border-radius:10px;background:var(--chip-bg);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s ease}
.date-picker button:active{transform:scale(.95);background:var(--accent);color:#fff}

main{padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;transition:transform .25s ease}
.loading{display:flex;flex-direction:column;align-items:center;gap:16px;padding:80px 20px}
.loading p{color:var(--faint);font-size:14px;font-weight:500}
.spinner{width:32px;height:32px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%}
.error{text-align:center;padding:80px 20px;color:#ff453a;font-size:14px;font-weight:500}
.news-list{display:flex;flex-direction:column;gap:12px}

.news-card{background:var(--card);border-radius:14px;padding:16px;color:inherit;display:block;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:transform .15s ease;animation:fadeIn .3s ease both}
.news-card:active{transform:scale(.98)}
.news-card.has-image{padding-bottom:0}
.card-content{display:flex;flex-direction:column;gap:8px}

.news-meta{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.source-group{display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer;padding:3px 8px;margin:-3px -8px;border-radius:8px;transition:background .15s ease}
.source-group:active{background:var(--accent-soft)}
.source-favicon{width:14px;height:14px;border-radius:4px;flex-shrink:0;background:var(--border)}
.news-source{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news-date{font-size:12px;color:var(--faint);margin-left:auto;flex-shrink:0}
.icon-btn{width:28px;height:28px;border:none;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;flex-shrink:0;padding:0}
.icon-btn:active{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.bookmarked{color:var(--accent)}

.news-title{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-description{font-size:13px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-image{width:calc(100% + 32px);height:160px;object-fit:cover;margin:12px -16px 0 -16px;display:block}

.empty{text-align:center;padding:60px 20px;color:var(--faint)}
.empty .icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px;font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--chip-active-bg);color:var(--chip-active-text);padding:10px 18px;border-radius:100px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="top-bar">
  <div class="header-content">
    <div class="header-text">
      <h1 class="title">Tech News</h1>
      <p class="subtitle" id="subtitle">Fetching latest stories…</p>
    </div>
    <div class="header-actions">
      <button class="hdr-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </button>
      <button class="hdr-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
      <button class="hdr-btn" id="archiveBtn" aria-label="Archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="4" x2="10" y2="20"/></svg>
      </button>
      <button class="hdr-btn" id="savedBtn" aria-label="Saved stories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="hdr-btn" id="refreshBtn" aria-label="Refresh news">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c-2.5-1.5-4-4-4-7s1.5-5.5 4-7"/></svg>
      </button>
    </div>
  </div>
  <div class="source-filters" id="sourceFilters"></div>
  <div class="date-picker" id="datePicker">
    <input type="date" id="archiveDate">
    <button id="viewArchive">View</button>
  </div>
  <div class="search-bar" id="searchBar">
    <input type="search" id="searchInput" placeholder="Search titles, descriptions, sources…" autocomplete="off">
  </div>
</div>

<main id="mainContent">
  <div class="loading" id="loading"><div class="spinner" style="animation:spin .8s linear infinite"></div><p>Loading news...</p></div>
  <div class="error" id="error" style="display:none"><p>Failed to load news. Pull down or tap refresh to retry.</p></div>
  <div class="news-list" id="newsList"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://tech-news-api.izafr.workers.dev/api/tech';

// ☁️ PASTE YOUR SUPABASE CREDENTIALS HERE
const SUPABASE_URL = 'https://mifkynpgpozxqrctpncq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pZmt5bnBncG96eHFyY3RwbmNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NDgxNjIsImV4cCI6MjEwMzAyNDE2Mn0.UrQ2r79hWmB7WiwMBwmdPtxsgR1ToW4IZppbbzyyvOE';

const BM_KEY = 'technews_bookmarks';
const THEME_KEY = 'technews_theme';

const FALLBACK_ICON = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="#e8e8ed"/><circle cx="8" cy="8" r="3.6" fill="none" stroke="#86868b" stroke-width="1.1"/></svg>');
const BM_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
const BM_FILL = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
const SHARE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

let newsData = [], activeFilter = 'all', view = 'feed', isLoading = false;
let sourceMap = new Map();
let metaInfo = { total: 0, updated_at: null };
let searchTimer = null;

document.addEventListener('DOMContentLoaded', () => {
  applyTheme(currentTheme());
  loadNews();
  document.getElementById('searchBtn').addEventListener('click', () => setView(view === 'search' ? 'feed' : 'search'));
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  document.getElementById('archiveBtn').addEventListener('click', () => setView(view === 'archive' ? 'feed' : 'archive'));
  document.getElementById('viewArchive').addEventListener('click', loadArchiveForDate);
  document.getElementById('archiveDate').addEventListener('change', loadArchiveForDate);
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 350);
  });
  document.getElementById('refreshBtn').addEventListener('click', () => {
    if (view === 'saved') renderNews();
    else if (view === 'archive') loadArchiveForDate();
    else if (view === 'search') doSearch();
    else loadNews(true);
  });
  document.getElementById('savedBtn').addEventListener('click', () => setView(view === 'saved' ? 'feed' : 'saved'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'dark' : 'light');
  });
  initPullToRefresh();
});

/* ---------- Theme ---------- */
function currentTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'dark' || saved === 'light') return saved;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').innerHTML = (t === 'dark') ? SUN_SVG : MOON_SVG;
  if (window.Android && Android.setStatusBarDark) Android.setStatusBarDark(t === 'dark');
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
  toast(next === 'dark' ? 'Dark mode on' : 'Light mode on');
}

/* ---------- Supabase ---------- */
function sbHeaders() {
  return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
}

async function autoArchive(articles) {
  const seen = new Set();
  const payload = [];
  articles.forEach(a => {
    if (!a.url || seen.has(a.url)) return;
    seen.add(a.url);
    payload.push({
      url: a.url,
      title: a.title || '',
      description: a.description || '',
      source: a.source || '',
      image: a.image || null,
      date: a.date || null
    });
  });
  if (!payload.length) return;

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/articles?on_conflict=url', {
      method: 'POST',
      headers: Object.assign({
        'Content-Type': 'application/json',
        'Prefer': 'resolution=ignore-duplicates, count=exact'
      }, sbHeaders()),
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      console.warn('Archive sync failed:', res.status, await res.text());
      toast('☁️ Sync failed (' + res.status + ')');
      return;
    }

    const range = res.headers.get('content-range');
    const inserted = range ? parseInt(range.split('/')[1], 10) : 0;
    if (inserted > 0) toast('☁️ ' + inserted + ' new stories archived');
  } catch (e) {
    console.warn('Archive sync skipped:', e);
  }
}

/* ---------- Data ---------- */
async function loadNews(isRefresh = false) {
  if (isLoading) return;
  isLoading = true;
  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const refreshBtn = document.getElementById('refreshBtn');

  loadingEl.style.display = 'flex';
  errorEl.style.display = 'none';
  document.getElementById('newsList').innerHTML = '';
  if (isRefresh) refreshBtn.classList.add('spinning');

  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error('Failed');
    const data = await response.json();

    newsData = Array.isArray(data) ? data : (data.items || data.articles || data.news || data.data || []);
    metaInfo = { total: data.total || newsData.length, updated_at: data.updated_at || null };

    autoArchive(newsData);

    buildSourceMap();
    if (activeFilter !== 'all' && !sourceMap.has(activeFilter)) activeFilter = 'all';
    renderFilters();
    renderNews();
    loadingEl.style.display = 'none';
  } catch (e) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    document.getElementById('subtitle').textContent = 'Connection failed';
  } finally {
    refreshBtn.classList.remove('spinning');
    isLoading = false;
    resetPull();
  }
}

function buildSourceMap() {
  sourceMap = new Map();
  newsData.forEach(a => {
    const s = a.source || '';
    if (!s) return;
    if (sourceMap.has(s)) sourceMap.get(s).count++;
    else sourceMap.set(s, { count: 1, domain: getDomain(a.url) });
  });
}

/* ---------- Views & filters ---------- */
function setView(v) {
  view = v;
  document.getElementById('savedBtn').classList.toggle('active', v === 'saved');
  document.getElementById('archiveBtn').classList.toggle('active', v === 'archive');
  document.getElementById('searchBtn').classList.toggle('active', v === 'search');
  document.getElementById('sourceFilters').style.display = (v === 'feed') ? 'flex' : 'none';
  document.getElementById('datePicker').style.display = (v === 'archive') ? 'flex' : 'none';
  document.getElementById('searchBar').style.display = (v === 'search') ? 'flex' : 'none';

  if (v === 'archive') {
    document.getElementById('archiveDate').value = new Date().toISOString().split('T')[0];
    loadArchiveForDate();
  } else if (v === 'search') {
    updateSubtitle();
    const q = document.getElementById('searchInput').value.trim();
    if (q) doSearch();
    else document.getElementById('newsList').innerHTML = '<div class="empty"><div class="icon">🔎</div><p>Search your entire news history.<br>Try "AI", "Samsung", "robot"…</p></div>';
    setTimeout(() => document.getElementById('searchInput').focus(), 150);
  } else {
    renderNews();
  }
}

function setFilter(key, scrollPill) {
  activeFilter = key;
  document.querySelectorAll('.filter-pill').forEach(p => {
    const on = p.dataset.source === key;
    p.classList.toggle('active', on);
    if (on && scrollPill) p.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
  renderNews();
}

function renderFilters() {
  const c = document.getElementById('sourceFilters');
  c.innerHTML = '';
  c.appendChild(createPill('all', 'All', newsData.length, null));
  [...sourceMap.entries()].sort((a, b) => b[1].count - a[1].count)
    .forEach(([s, info]) => c.appendChild(createPill(s, s, info.count, info.domain)));
}

function createPill(key, label, count, domain) {
  const btn = document.createElement('button');
  btn.className = 'filter-pill' + (activeFilter === key ? ' active' : '');
  btn.dataset.source = key;
  let html = '';
  if (key === 'all') {
    html += '<svg class="pill-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" style="background:transparent"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>';
  } else if (domain) {
    html += '<img class="pill-icon" src="https://www.google.com/s2/favicons?domain=' + domain + '&sz=32" alt="">';
  }
  html += '<span>' + escapeHtml(label) + '</span><span class="count">' + count + '</span>';
  btn.innerHTML = html;
  const img = btn.querySelector('img.pill-icon');
  if (img) img.addEventListener('error', () => { img.src = FALLBACK_ICON; }, { once: true });
  btn.addEventListener('click', () => setFilter(key, false));
  return btn;
}

/* ---------- 🔍 Search ---------- */
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  const list = document.getElementById('newsList');
  if (!q) {
    list.innerHTML = '<div class="empty"><div class="icon">🔎</div><p>Search your entire news history.<br>Try "AI", "Samsung", "robot"…</p></div>';
    updateSubtitle();
    return;
  }

  list.innerHTML = '<div class="loading"><div class="spinner" style="animation:spin .8s linear infinite"></div><p>Searching…</p></div>';
  const enc = encodeURIComponent(q);
  const urlQ = SUPABASE_URL + '/rest/v1/articles?or=(title.ilike.*' + enc + '*,description.ilike.*' + enc + '*,source.ilike.*' + enc + '*)&order=date.desc&limit=200';

  try {
    const res = await fetch(urlQ, { headers: sbHeaders() });
    if (!res.ok) throw new Error('Search failed');
    const rows = await res.json();

    document.getElementById('subtitle').innerHTML =
      '<span class="live-dot" style="background:var(--accent)"></span>' + rows.length + ' result' + (rows.length === 1 ? '' : 's') + ' for "' + escapeHtml(q) + '"';

    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<div class="empty"><div class="icon">🔎</div><p>No stories found for "' + escapeHtml(q) + '"</p></div>';
      return;
    }
    rows.forEach((a, i) => list.appendChild(createNewsCard(a, i)));
  } catch (e) {
    list.innerHTML = '<div class="empty"><div class="icon">📡</div><p>Search failed.<br>Check your connection and try again.</p></div>';
  }
}

/* ---------- Rendering ---------- */
function updateSubtitle() {
  const el = document.getElementById('subtitle');
  if (view === 'saved') {
    el.innerHTML = '<span class="live-dot" style="background:var(--accent)"></span>' + getBookmarks().length + ' saved stories';
  } else if (view === 'archive') {
    el.innerHTML = '<span class="live-dot" style="background:#ff9500"></span>Browsing cloud archive';
  } else if (view === 'search') {
    el.innerHTML = '<span class="live-dot" style="background:var(--accent)"></span>Search your full archive';
  } else if (activeFilter !== 'all') {
    const n = newsData.filter(a => (a.source || '') === activeFilter).length;
    el.innerHTML = '<span class="live-dot"></span>' + n + ' ' + escapeHtml(activeFilter) + ' stories';
  } else {
    el.innerHTML = metaInfo.updated_at
      ? '<span class="live-dot"></span>Updated ' + formatDate(new Date(metaInfo.updated_at))
      : '<span class="live-dot"></span>Live feed';
  }
}

function renderNews() {
  updateSubtitle();
  const list = document.getElementById('newsList');
  list.innerHTML = '';

  if (view === 'saved') {
    const saved = getBookmarks().sort((a, b) => b.savedAt - a.savedAt);
    if (!saved.length) {
      list.innerHTML = '<div class="empty"><div class="icon">🔖</div><p>No saved stories yet.<br>Tap the bookmark icon on any article.</p></div>';
      return;
    }
    saved.forEach((a, i) => list.appendChild(createNewsCard(a, i)));
    return;
  }

  if (view === 'archive' || view === 'search') return;

  const filtered = activeFilter === 'all' ? newsData : newsData.filter(a => (a.source || '') === activeFilter);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><div class="icon">📭</div><p>No stories from ' + escapeHtml(activeFilter) + '</p></div>';
    return;
  }
  filtered.forEach((a, i) => list.appendChild(createNewsCard(a, i)));
}

async function loadArchiveForDate() {
  const dateVal = document.getElementById('archiveDate').value;
  if (!dateVal) return;
  const list = document.getElementById('newsList');
  list.innerHTML = '<div class="loading"><div class="spinner" style="animation:spin .8s linear infinite"></div><p>Loading archive…</p></div>';

  const start = new Date(dateVal + 'T00:00:00');
  const end = new Date(start.getTime() + 86400000);
  const q = SUPABASE_URL + '/rest/v1/articles?date=gte.' + start.toISOString() +
            '&date=lt.' + end.toISOString() + '&order=date.desc';

  try {
    const res = await fetch(q, { headers: sbHeaders() });
    if (!res.ok) throw new Error('Archive fetch failed');
    const rows = await res.json();

    document.getElementById('subtitle').innerHTML =
      '<span class="live-dot" style="background:#ff9500"></span>' + rows.length +
      ' archived stories · ' + start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

    list.innerHTML = '';
    if (!rows.length) {
      list.innerHTML = '<div class="empty"><div class="icon">📅</div><p>No archived stories for this date yet.<br>The archive grows every time you open the app.</p></div>';
      return;
    }
    rows.forEach((a, i) => list.appendChild(createNewsCard(a, i)));
  } catch (e) {
    list.innerHTML = '<div class="empty"><div class="icon">📡</div><p>Couldn\'t load the archive.<br>Check your connection and try again.</p></div>';
  }
}

function createNewsCard(article, index) {
  const card = document.createElement('article');
  card.className = 'news-card';
  card.dataset.url = article.url;
  if (article.image) card.classList.add('has-image');

  const date = article.date ? formatDate(new Date(article.date)) : '';
  const domain = getDomain(article.url);
  const favicon = domain ? 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=32' : FALLBACK_ICON;
  const saved = isBookmarked(article.url);

  card.innerHTML =
    '<div class="card-content">' +
      '<div class="news-meta">' +
        '<span class="source-group">' +
          '<img class="source-favicon" src="' + favicon + '" alt="">' +
          '<span class="news-source">' + escapeHtml(article.source || domain || 'Tech') + '</span>' +
        '</span>' +
        '<span class="news-date">' + date + '</span>' +
        '<button class="icon-btn share-btn" aria-label="Share">' + SHARE_SVG + '</button>' +
        '<button class="icon-btn bookmark-btn' + (saved ? ' bookmarked' : '') + '" aria-label="Save">' + (saved ? BM_FILL : BM_OUT) + '</button>' +
      '</div>' +
      '<div class="news-title">' + escapeHtml(article.title) + '</div>' +
      (article.description ? '<div class="news-description">' + escapeHtml(article.description) + '</div>' : '') +
    '</div>' +
    (article.image ? '<img src="' + article.image + '" alt="" class="news-image" loading="lazy" onerror="this.style.display=\'none\'">' : '');

  card.style.animationDelay = (index * 0.03) + 's';

  card.querySelector('.source-favicon').addEventListener('error', function () { this.src = FALLBACK_ICON; }, { once: true });
  card.addEventListener('click', () => openArticle(article));
  card.querySelector('.source-group').addEventListener('click', (e) => {
    e.stopPropagation();
    if (view !== 'feed') setView('feed');
    setFilter(article.source || '', true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  card.querySelector('.share-btn').addEventListener('click', (e) => { e.stopPropagation(); shareArticle(article); });
  card.querySelector('.bookmark-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleBookmark(article); });

  return card;
}

/* ---------- Native bridge ---------- */
function openArticle(a) {
  if (window.Android && Android.openArticle) Android.openArticle(a.url, a.title, a.source || '');
  else window.open(a.url, '_blank');
}
function shareArticle(a) {
  if (window.Android && Android.shareArticle) Android.shareArticle(a.url, a.title);
  else if (navigator.share) navigator.share({ title: a.title, url: a.url });
  else window.open(a.url, '_blank');
}

/* ---------- Bookmarks ---------- */
function getBookmarks() { try { return JSON.parse(localStorage.getItem(BM_KEY)) || []; } catch (e) { return []; } }
function isBookmarked(url) { return getBookmarks().some(b => b.url === url); }
function toggleBookmark(a) {
  let list = getBookmarks();
  if (isBookmarked(a.url)) {
    list = list.filter(b => b.url !== a.url);
    toast('Removed from saved');
  } else {
    list.push(Object.assign({}, a, { savedAt: Date.now() }));
    toast('Saved for later');
  }
  localStorage.setItem(BM_KEY, JSON.stringify(list));
  if (view === 'saved') renderNews();
  else {
    document.querySelectorAll('.news-card').forEach(el => {
      const on = isBookmarked(el.dataset.url);
      const btn = el.querySelector('.bookmark-btn');
      btn.classList.toggle('bookmarked', on);
      btn.innerHTML = on ? BM_FILL : BM_OUT;
    });
    updateSubtitle();
  }
}

/* ---------- Pull to refresh ---------- */
const pull = { startY: null, startX: null, dist: 0, active: false };
function initPullToRefresh() {
  document.addEventListener('touchstart', (e) => {
    if (view !== 'feed') return;
    if (window.scrollY <= 0) { pull.startY = e.touches[0].clientY; pull.startX = e.touches[0].clientX; }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (pull.startY === null || isLoading || view !== 'feed') return;
    if (e.target.closest('.source-filters')) return;
    const dy = e.touches[0].clientY - pull.startY;
    const dx = e.touches[0].clientX - pull.startX;
    if (!pull.active && (dy < 12 || Math.abs(dx) > Math.abs(dy))) return;
    if (dy > 0 && window.scrollY <= 0) {
      pull.active = true;
      pull.dist = Math.min(dy * 0.4, 100);
      e.preventDefault();
      const main = document.getElementById('mainContent');
      main.style.transition = 'none';
      main.style.transform = 'translateY(' + pull.dist + 'px)';
      const svg = document.querySelector('#refreshBtn svg');
      svg.style.transform = 'rotate(' + (pull.dist * 3.6) + 'deg)';
    }
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (pull.active && pull.dist >= 70) loadNews(true);
    else resetPull();
    pull.startY = null;
  });
}
function resetPull() {
  pull.active = false; pull.dist = 0;
  const main = document.getElementById('mainContent');
  main.style.transition = ''; main.style.transform = '';
  const svg = document.querySelector('#refreshBtn svg');
  if (svg) svg.style.transform = '';
}

/* ---------- Utils ---------- */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1800);
}
function getDomain(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function formatDate(date) {
  const ms = Date.now() - date;
  const m = Math.floor(ms / 60000), h = Math.floor(ms / 3600000), d = Math.floor(ms / 86400000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (h < 24) return h + 'h ago';
  if (d < 7) return d + 'd ago';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
</script>
